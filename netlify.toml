# Netlify build settings. Netlify detects Next.js and applies its official
# adapter (@netlify/plugin-nextjs) automatically.
#
# The build first brings the database up to date: migrations are safe to run
# every time, and the starting catalogue is loaded only into an empty
# database (scripts/seed-if-empty.ts), so a deploy never overwrites the shop.

[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
